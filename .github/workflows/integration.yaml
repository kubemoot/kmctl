# Tier 2 drift detection - NOT per-push (keeps push CI fast). Runs against an
# ephemeral apiserver (envtest) loaded with the CURRENT Kubemoot CRDs, so it
# catches CRD/GVR/schema drift without the operator or the homelab cluster.
name: Integration (drift)

on:
  schedule:
    - cron: "0 7 * * *" # nightly
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    runs-on: homelab-runners
    steps:
      - name: Checkout kmctl
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Fetch current Kubemoot CRDs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kubemoot/kubemoot
          token: ${{ secrets.KUBEMOOT_READ_TOKEN || github.token }}
          path: _kubemoot
          sparse-checkout: operator/config/crd/bases
          sparse-checkout-cone-mode: false

      - name: Drift tests (envtest + contract vs current CRDs)
        env:
          KMCTL_CRD_DIR: ${{ github.workspace }}/_kubemoot/operator/config/crd/bases
        # go.mod is the version source: setup-envtest comes from the release branch of
        # the controller-runtime kmctl builds with, and the API server is the
        # Kubernetes minor of its client-go.
        run: |
          minor_of() { go list -m -f '{{.Version}}' "$1" | sed -E 's/^v([0-9]+)\.([0-9]+)\..*/\1.\2/'; }
          GOBIN="$PWD/bin" go install "sigs.k8s.io/controller-runtime/tools/setup-envtest@release-$(minor_of sigs.k8s.io/controller-runtime)"
          k8s="1.$(minor_of k8s.io/client-go | cut -d. -f2)"
          KUBEBUILDER_ASSETS="$(./bin/setup-envtest use "${k8s}" --bin-dir "$PWD/bin" -p path)"
          export KUBEBUILDER_ASSETS
          go test -tags=integration ./internal/integration/...
