# Tier 2 drift detection - NOT per-push (keeps push CI fast). Runs against an
# ephemeral apiserver (envtest) loaded with the CURRENT Kubemoot CRDs, so it
# catches CRD/GVR/schema drift without the operator or the homelab cluster.
name: Integration (drift)

on:
  schedule:
    - cron: "0 7 * * *" # nightly
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    runs-on: homelab-runners
    steps:
      - name: Checkout kmctl
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: 'v3.19.0'

      - name: Fetch current Kubemoot CRDs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kubemoot/kubemoot
          path: _kubemoot
          sparse-checkout: operator/config/crd/bases
          sparse-checkout-cone-mode: false

      - name: Drift tests (envtest + contract vs current CRDs)
        env:
          KMCTL_CRD_DIR: ${{ github.workspace }}/_kubemoot/operator/config/crd/bases
          KMCTL_REQUIRE_SCAFFOLD_APPLIES: "1" # the scaffold test needs helm; never skip it here
        run: |
          KUBEBUILDER_ASSETS="$(scripts/envtest-assets.sh)"
          export KUBEBUILDER_ASSETS
          go test -tags=integration ./internal/integration/...
