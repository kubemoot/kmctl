# Publish Release: publish a tested kmctl release candidate as the public release.
#
# Every push to main tags a release candidate vX.Y.Z-rc.N and builds it without
# publishing. A maintainer runs this workflow (Actions tab, Run workflow; dispatch
# needs write access) to tag the candidate's commit vX.Y.Z and run goreleaser on it:
# binaries, checksums, and the GitHub Release with notes from the conventional commits
# since the previous release. The default is a dry run: goreleaser builds a snapshot
# and the run summary shows the notes; nothing is tagged or published.
#
# Every release is verifiable without a stored key. cosign signs checksums.txt keylessly
# with this workflow's GitHub OIDC identity (checksums.txt.sigstore.json), and
# actions/attest records SLSA build provenance for every archive
# (kmctl_<version>.intoto.jsonl, also kept in the repository's attestations). Both are
# attached to the draft release before it is published, since GitHub's immutable
# releases lock the assets on publish. A dry run signs and verifies its snapshot too,
# so a signing problem shows before anything is tagged; it attests nothing.
name: Publish Release

on:
  workflow_dispatch:
    inputs:
      rc_tag:
        description: '"latest", or a vX.Y.Z-rc.N tag on main'
        required: true
        default: latest
        type: string
      dry_run:
        description: 'Dry run: build a snapshot and show the notes, publish nothing'
        required: true
        default: true
        type: boolean

concurrency:
  group: publish-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    # The same runners as every release in the ecosystem, and only from main.
    if: github.ref == 'refs/heads/main'
    runs-on: homelab-runners
    permissions:
      contents: write
      # goreleaser runs cosign itself, so the job that builds also signs and attests;
      # the attestation stays here so the provenance names the runner that built.
      id-token: write # Sigstore keyless signing and the provenance attestation
      attestations: write # store the provenance attestation in the repository
    outputs:
      final_tag: ${{ steps.tag.outputs.final_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # RELEASE_TOKEN (contents and workflows write) lets the final tag land on the
          # candidate's commit when workflow files changed on main after it; the default
          # token is refused there. Falls back to the default token.
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
          fetch-depth: 0

      - name: Set up the release helpers
        uses: kubemoot/release-actions/setup@6ba4d559b8ec0fe5b57b101eb7831ab48289c036 # v0.10.2

      - name: Tag the final version
        id: tag
        env:
          RC_TAG: ${{ inputs.rc_tag }}
          DRY_RUN: ${{ inputs.dry_run }}
          OUT_DIR: ${{ runner.temp }}/release-files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # shellcheck source=/dev/null
          source "${RELEASE_LIB}"
          rl_promote_single v kmctl "${OUT_DIR}" >> "$GITHUB_OUTPUT"
          cat "${OUT_DIR}/notes.md" >> "$GITHUB_STEP_SUMMARY"

      # goreleaser builds from the checkout, so it moves to the candidate's commit; the
      # notes live outside the checkout so the tree stays clean.
      - name: Check out the release commit
        env:
          COMMIT: ${{ steps.tag.outputs.commit }}
        run: git checkout --quiet "${COMMIT}"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Build a snapshot (dry run)
        if: inputs.dry_run
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: latest
          args: release --clean --snapshot

      - name: Publish the release with goreleaser
        if: ${{ !inputs.dry_run }}
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: latest
          args: release --clean --release-notes ${{ runner.temp }}/release-files/notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ steps.tag.outputs.final_tag }}
          GORELEASER_PREVIOUS_TAG: ${{ steps.tag.outputs.previous_tag }}

      # The certificate names the workflow that signed: publish-release.yaml on main.
      - name: Verify the checksums signature
        env:
          IDENTITY: https://github.com/${{ github.workflow_ref }}
        run: |
          cosign verify-blob dist/checksums.txt \
            --bundle dist/checksums.txt.sigstore.json \
            --certificate-identity "${IDENTITY}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com

      - name: Attest the build provenance
        id: attest
        if: ${{ !inputs.dry_run }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt

      - name: Name the provenance for the release
        if: ${{ !inputs.dry_run }}
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          FINAL_TAG: ${{ steps.tag.outputs.final_tag }}
        run: |
          mkdir -p "${RUNNER_TEMP}/provenance"
          cp "${BUNDLE}" "${RUNNER_TEMP}/provenance/kmctl_${FINAL_TAG#v}.intoto.jsonl"

      - name: Keep the provenance
        if: ${{ !inputs.dry_run }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: provenance
          path: ${{ runner.temp }}/provenance/
          if-no-files-found: error
          retention-days: 30

  # goreleaser left the release a draft; the provenance goes on it, checked against the
  # archives the draft holds, and then the release is published (GitHub-hosted, for gh;
  # gh release download, upload, and edit all find a draft by its tag name). A failed
  # run of this job alone can be re-run, since the draft and the provenance artifact stay.
  publish:
    needs: prepare
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload to and publish the draft release
    steps:
      - name: Download the provenance
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: provenance
          path: provenance

      - name: Verify the draft's archives against the provenance
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.final_tag }}
        run: |
          gh release download "${TAG}" --repo "${GITHUB_REPOSITORY}" --dir archives \
            --pattern 'kmctl_*.tar.gz' --pattern 'kmctl_*.zip'
          for archive in archives/*; do
            gh attestation verify "${archive}" --repo "${GITHUB_REPOSITORY}" \
              --bundle "provenance/kmctl_${TAG#v}.intoto.jsonl" \
              --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/publish-release.yaml"
          done

      - name: Attach the provenance and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.final_tag }}
        run: |
          gh release upload "${TAG}" --repo "${GITHUB_REPOSITORY}" --clobber \
            "provenance/kmctl_${TAG#v}.intoto.jsonl"
          gh release edit "${TAG}" --repo "${GITHUB_REPOSITORY}" --draft=false --latest
