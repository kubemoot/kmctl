# Publish Release: publish a tested kmctl release candidate as the public release.
#
# Every push to main tags a release candidate vX.Y.Z-rc.N and builds it without
# publishing. A maintainer runs this workflow (Actions tab, Run workflow; dispatch
# needs write access) to tag the candidate's commit vX.Y.Z and run goreleaser on it:
# binaries, checksums, and the GitHub Release with notes from the conventional commits
# since the previous release. The default is a dry run: goreleaser builds a snapshot
# and the run summary shows the notes; nothing is tagged or published.
#
# Every release is verifiable without a stored key. cosign signs checksums.txt keylessly
# with this workflow's GitHub OIDC identity (checksums.txt.sigstore.json), and
# actions/attest records SLSA build provenance for every archive
# (kmctl_<version>.intoto.jsonl, also kept in the repository's attestations). Both are
# attached to the draft release before it is published, since GitHub's immutable
# releases lock the assets on publish. A dry run signs and verifies its snapshot too,
# so a signing problem shows before anything is tagged; it attests nothing.
name: Publish Release

on:
  workflow_dispatch:
    inputs:
      rc_tag:
        description: '"latest", or a vX.Y.Z-rc.N tag on main'
        required: true
        default: latest
        type: string
      dry_run:
        description: 'Dry run: build a snapshot and show the notes, publish nothing'
        required: true
        default: true
        type: boolean

concurrency:
  group: publish-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    # The same runners as every release in the ecosystem, and only from main.
    if: github.ref == 'refs/heads/main'
    runs-on: homelab-runners
    permissions:
      contents: write
      # goreleaser runs cosign itself, so the job that builds also signs and attests;
      # the attestation stays here so the provenance names the runner that built.
      id-token: write # Sigstore keyless signing and the provenance attestation
      attestations: write # store the provenance attestation in the repository
    outputs:
      final_tag: ${{ steps.tag.outputs.final_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No credential is stored; the release token is minted at the step that pushes.
          persist-credentials: false
          fetch-depth: 0

      - name: Set up the release helpers
        uses: kubemoot/release-actions/setup@899dec57c20fafcccae4120d20bfd88e454f0a0f # v0.12.2

      # Before anything is tagged: the candidate this run would release must make a crew
      # the Kubemoot it pins accepts. kmctl create's bundle and chart, every size, apply
      # with strict validation to an API server loaded with the CRDs of the operator
      # module go.mod pins (the Kubemoot this kmctl targets; go.mod records a Kubemoot
      # commit, not a release tag). A dry run runs it too.
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: Install Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: 'v3.19.0'

      - name: Check the candidate's scaffold applies to the Kubemoot it pins
        id: gate
        env:
          RC_TAG: ${{ inputs.rc_tag }}
          WORKTREE: ${{ runner.temp }}/candidate
          SCRATCH: ${{ runner.temp }}/gate-files
        run: |
          # shellcheck source=/dev/null
          source "${RELEASE_LIB}"
          # The commit comes from the same function the tag step runs, in a dry run that
          # tags nothing, so the gate tests the candidate that step will tag, not main's head.
          commit="$(DRY_RUN=true rl_promote_single v kmctl "${SCRATCH}" | sed -n 's/^commit=//p')"
          [ -n "${commit}" ] || { echo "ERROR: could not resolve the candidate's commit" >&2; exit 1; }
          echo "commit=${commit}" >> "$GITHUB_OUTPUT"
          git worktree add --detach "${WORKTREE}" "${commit}"
          cd "${WORKTREE}"
          if [ ! -x scripts/scaffold-applies.sh ]; then
            echo "ERROR: ${commit} predates the scaffold-applies gate; release a newer candidate" >&2
            exit 1
          fi
          scripts/scaffold-applies.sh

      - name: Mint a release token
        id: app-token
        if: ${{ !inputs.dry_run }}
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          repositories: kmctl
          permission-contents: write
          permission-workflows: write

      - name: Tag the final version
        id: tag
        env:
          GH_APP_TOKEN: ${{ steps.app-token.outputs.token }}
          RC_TAG: ${{ inputs.rc_tag }}
          DRY_RUN: ${{ inputs.dry_run }}
          OUT_DIR: ${{ runner.temp }}/release-files
        run: |
          if [ "${DRY_RUN:-false}" != true ]; then
            if [ -z "${GH_APP_TOKEN:-}" ]; then
              echo "::error::no release token: the mint step did not run" >&2
              exit 1
            fi
            auth="$(printf 'x-access-token:%s' "${GH_APP_TOKEN}" | base64 -w0)"
            echo "::add-mask::${auth}"
            export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth}"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # shellcheck source=/dev/null
          source "${RELEASE_LIB}"
          rl_promote_single v kmctl "${OUT_DIR}" >> "$GITHUB_OUTPUT"
          cat "${OUT_DIR}/notes.md" >> "$GITHUB_STEP_SUMMARY"

      # The gate must have tested the commit that was tagged. Both come from
      # rl_promote_single; this stops the run before anything is built or published if
      # they ever differ (a candidate pushed between the two steps, a change to the lib).
      - name: Check the tagged commit is the one the gate tested
        env:
          GATED: ${{ steps.gate.outputs.commit }}
          TAGGED: ${{ steps.tag.outputs.commit }}
        run: |
          if [ "${GATED}" != "${TAGGED}" ]; then
            echo "ERROR: the scaffold gate tested ${GATED} but the release tags ${TAGGED}" >&2
            exit 1
          fi

      # goreleaser builds from the checkout, so it moves to the candidate's commit; the
      # notes live outside the checkout so the tree stays clean.
      - name: Check out the release commit
        env:
          COMMIT: ${{ steps.tag.outputs.commit }}
        run: git checkout --quiet "${COMMIT}"

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Build a snapshot (dry run)
        if: inputs.dry_run
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: latest
          args: release --clean --snapshot

      - name: Publish the release with goreleaser
        if: ${{ !inputs.dry_run }}
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: latest
          args: release --clean --release-notes ${{ runner.temp }}/release-files/notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ steps.tag.outputs.final_tag }}
          GORELEASER_PREVIOUS_TAG: ${{ steps.tag.outputs.previous_tag }}

      # The certificate names the workflow that signed: publish-release.yaml on main.
      - name: Verify the checksums signature
        env:
          IDENTITY: https://github.com/${{ github.workflow_ref }}
        run: |
          cosign verify-blob dist/checksums.txt \
            --bundle dist/checksums.txt.sigstore.json \
            --certificate-identity "${IDENTITY}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com

      - name: Attest the build provenance
        id: attest
        if: ${{ !inputs.dry_run }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt

      - name: Name the provenance for the release
        if: ${{ !inputs.dry_run }}
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          FINAL_TAG: ${{ steps.tag.outputs.final_tag }}
        run: |
          mkdir -p "${RUNNER_TEMP}/provenance"
          cp "${BUNDLE}" "${RUNNER_TEMP}/provenance/kmctl_${FINAL_TAG#v}.intoto.jsonl"

      - name: Keep the provenance
        if: ${{ !inputs.dry_run }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: provenance
          path: ${{ runner.temp }}/provenance/
          if-no-files-found: error
          retention-days: 30

  # goreleaser left the release a draft; the provenance goes on it, checked against the
  # archives the draft holds, and then the release is published (GitHub-hosted, for gh;
  # gh release download, upload, and edit all find a draft by its tag name). A failed
  # run of this job alone can be re-run, since the draft and the provenance artifact stay.
  publish:
    needs: prepare
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload to and publish the draft release
    steps:
      - name: Download the provenance
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: provenance
          path: provenance

      - name: Verify the draft's archives against the provenance
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.final_tag }}
        run: |
          gh release download "${TAG}" --repo "${GITHUB_REPOSITORY}" --dir archives \
            --pattern 'kmctl_*.tar.gz' --pattern 'kmctl_*.zip'
          for archive in archives/*; do
            gh attestation verify "${archive}" --repo "${GITHUB_REPOSITORY}" \
              --bundle "provenance/kmctl_${TAG#v}.intoto.jsonl" \
              --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/publish-release.yaml"
          done

      - name: Attach the provenance and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.final_tag }}
        run: |
          gh release upload "${TAG}" --repo "${GITHUB_REPOSITORY}" --clobber \
            "provenance/kmctl_${TAG#v}.intoto.jsonl"
          gh release edit "${TAG}" --repo "${GITHUB_REPOSITORY}" --draft=false --latest
