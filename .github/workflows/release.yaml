name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yaml

  release:
    needs: ci
    runs-on: homelab-runners
    permissions:
      contents: write # push the release candidate tag
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # RELEASE_TOKEN (contents+workflows write) pushes even when main's workflow files changed after this commit; GITHUB_TOKEN is refused there.
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
          fetch-depth: 0

      - name: Calculate the release candidate version
        id: version
        uses: kubemoot/release-actions/release-candidate-version@76c35a749b9db4105e73307b91b8f7cf1359b755 # v0.4.0
        with:
          tag_prefix: "v"

      - name: Create and push the candidate tag
        if: steps.version.outputs.release_created == 'true'
        env:
          TAG: ${{ steps.version.outputs.version_tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "tag ${TAG} already exists, skipping"
          else
            git tag -a "${TAG}" -m "Release candidate ${TAG}"
            git push origin "${TAG}"
          fi

      - name: Set up Go
        if: steps.version.outputs.release_created == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # A candidate builds every archive and checksum to prove the release works, and
      # publishes nothing; Promote Release publishes the final version.
      - name: Build the candidate with goreleaser (no publish)
        if: steps.version.outputs.release_created == 'true'
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: latest
          args: release --clean --skip=publish,announce
        env:
          # read-only use: the changelog reads commits through the GitHub API
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ steps.version.outputs.version_tag }}
