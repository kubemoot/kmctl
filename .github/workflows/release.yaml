name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yaml

  release:
    needs: ci
    runs-on: homelab-runners
    permissions:
      contents: write # push the release candidate tag
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Calculate the release candidate version
        id: version
        uses: ./.github/actions/release-candidate-version
        with:
          tag_prefix: "v"

      - name: Create and push the candidate tag
        if: steps.version.outputs.release_created == 'true'
        env:
          TAG: ${{ steps.version.outputs.version_tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "tag ${TAG} already exists, skipping"
          else
            git tag -a "${TAG}" -m "Release candidate ${TAG}"
            git push origin "${TAG}"
          fi

      - name: Set up Go
        if: steps.version.outputs.release_created == 'true'
        uses: actions/setup-go@v6
        with:
          go-version: '1.27'

      # A candidate builds every archive and checksum to prove the release works, and
      # publishes nothing; Promote Release publishes the final version.
      - name: Build the candidate with goreleaser (no publish)
        if: steps.version.outputs.release_created == 'true'
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean --skip=publish,announce
        env:
          # read-only use: the changelog reads commits through the GitHub API
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ steps.version.outputs.version_tag }}
