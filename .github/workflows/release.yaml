name: Release

# A Kubemoot Publish Release sends the kubemoot-published event when it succeeds; this
# repository then builds a forced candidate (as the crews do), so the next Publish
# Release here has a candidate built against the Kubemoot finals just published.

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [kubemoot-published]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yaml

  release:
    needs: ci
    runs-on: homelab-runners
    permissions:
      contents: write # push the release candidate tag
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # RELEASE_TOKEN (contents+workflows write) pushes even when main's workflow files changed after this commit; GITHUB_TOKEN is refused there.
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
          fetch-depth: 0

      - name: Calculate the release candidate version
        id: version
        uses: kubemoot/release-actions/release-candidate-version@7accfbc33966d895bab2fc17a2a6c7f2520aaf76 # v0.11.1
        with:
          tag_prefix: "v"
          force: ${{ github.event_name == 'repository_dispatch' }}

      - name: Create and push the candidate tag
        if: steps.version.outputs.release_created == 'true'
        env:
          TAG: ${{ steps.version.outputs.version_tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "tag ${TAG} already exists, skipping"
          else
            git tag -a "${TAG}" -m "Release candidate ${TAG}"
            git push origin "${TAG}"
          fi

      - name: Set up Go
        if: steps.version.outputs.release_created == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # A candidate builds every archive and checksum to prove the release works, and
      # publishes and signs nothing; Publish Release signs and publishes the final version.
      - name: Build the candidate with goreleaser (no publish)
        if: steps.version.outputs.release_created == 'true'
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: latest
          args: release --clean --skip=publish,announce,sign
        env:
          # read-only use: the changelog reads commits through the GitHub API
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ steps.version.outputs.version_tag }}
