# Promote Release: publish a tested kmctl release candidate as the public release.
#
# Every push to main tags a release candidate vX.Y.Z-rc.N and builds it without
# publishing. A maintainer runs this workflow (Actions tab, Run workflow; dispatch
# needs write access) to tag the candidate's commit vX.Y.Z and run goreleaser on it:
# binaries, checksums, and the GitHub Release with notes from the conventional commits
# since the previous release. The default is a dry run: goreleaser builds a snapshot
# and the run summary shows the notes; nothing is tagged or published.
name: Promote Release

on:
  workflow_dispatch:
    inputs:
      rc_tag:
        description: '"latest", or a vX.Y.Z-rc.N tag on main'
        required: true
        default: latest
        type: string
      dry_run:
        description: 'Dry run: build a snapshot and show the notes, publish nothing'
        required: true
        default: true
        type: boolean

concurrency:
  group: promote-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  promote:
    # The same runners as every release in the ecosystem, and only from main.
    if: github.ref == 'refs/heads/main'
    runs-on: homelab-runners
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # RELEASE_TOKEN (contents and workflows write) lets the final tag land on the
          # candidate's commit when workflow files changed on main after it; the default
          # token is refused there. Falls back to the default token.
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
          fetch-depth: 0

      - name: Set up the release helpers
        uses: kubemoot/release-actions/setup@76c35a749b9db4105e73307b91b8f7cf1359b755 # v0.4.0

      - name: Tag the final version
        id: promote
        env:
          RC_TAG: ${{ inputs.rc_tag }}
          DRY_RUN: ${{ inputs.dry_run }}
          OUT_DIR: ${{ runner.temp }}/promotion
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # shellcheck source=/dev/null
          source "${RELEASE_LIB}"
          rl_promote_single v kmctl "${OUT_DIR}" >> "$GITHUB_OUTPUT"
          cat "${OUT_DIR}/notes.md" >> "$GITHUB_STEP_SUMMARY"

      # goreleaser builds from the checkout, so it moves to the promoted commit; the
      # notes live outside the checkout so the tree stays clean.
      - name: Check out the promoted commit
        env:
          COMMIT: ${{ steps.promote.outputs.commit }}
        run: git checkout --quiet "${COMMIT}"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build a snapshot (dry run)
        if: inputs.dry_run
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: latest
          args: release --clean --snapshot

      - name: Publish the release with goreleaser
        if: ${{ !inputs.dry_run }}
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: latest
          args: release --clean --release-notes ${{ runner.temp }}/promotion/notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ steps.promote.outputs.final_tag }}
          GORELEASER_PREVIOUS_TAG: ${{ steps.promote.outputs.previous_tag }}
