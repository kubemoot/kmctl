# Dependabot version updates: weekly, one grouped pull request per ecosystem.
# Commit prefixes drive the semantic version bump (chore and ci are patch bumps).
# Every pull request is reviewed by a maintainer before it merges.
version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - "/"
      # Not .github/actions/release-candidate-version: that action is a byte-identical
      # copy in all five repos, so it is bumped in all of them together until it moves
      # to kubemoot/release-actions.
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"

  - package-ecosystem: gomod
    directories:
      - "/"
    schedule:
      interval: weekly
    groups:
      gomod:
        patterns: ["*"]
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
