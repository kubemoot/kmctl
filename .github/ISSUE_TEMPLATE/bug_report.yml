name: Bug report
description: A kmctl command misbehaves.
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: "This repository covers the kmctl command line. Operator, dashboard, or agent problems belong in [kubemoot/kubemoot](https://github.com/kubemoot/kubemoot/issues/new/choose); questions go to [Discussions](https://github.com/orgs/kubemoot/discussions/categories/q-a)."
  - type: checkboxes
    id: searched
    attributes:
      label: Before you file
      options:
        - label: I searched existing issues and did not find this one
          required: true
  - type: input
    id: kmctl-version
    attributes:
      label: kmctl version
      placeholder: "The output of `kmctl version`"
    validations:
      required: true
  - type: input
    id: os-arch
    attributes:
      label: Operating system and architecture
      placeholder: For example Linux, macOS, or Windows, and amd64 or arm64
    validations:
      required: true
  - type: dropdown
    id: install-method
    attributes:
      label: How you installed kmctl
      options:
        - Release archive
        - go install
        - Other
    validations:
      required: true
  - type: input
    id: kubemoot-version
    attributes:
      label: Kubemoot version
      placeholder: "The operator chart version from `helm list -A`"
    validations:
      required: true
  - type: input
    id: kubernetes
    attributes:
      label: Kubernetes version
      placeholder: "The server version from `kubectl version`"
    validations:
      required: false
  - type: textarea
    id: command
    attributes:
      label: The exact command
      description: Copy it as you ran it. Remove secrets first.
      render: shell
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Its output
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
