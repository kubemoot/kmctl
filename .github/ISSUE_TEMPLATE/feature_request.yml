name: Feature request
description: Something new or different in kmctl, argued from the problem it solves.
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: "This repository covers the kmctl command line. Ideas for the operator, dashboard, or crews belong in their own repositories, linked from [the issue chooser](https://github.com/kubemoot/kmctl/issues/new/choose). Something that worked or should work does not? File a Bug report instead; this form is for something new or different."
  - type: checkboxes
    id: searched
    attributes:
      label: Before you file
      options:
        - label: I searched existing issues and discussions and did not find this one
          required: true
  - type: dropdown
    id: area
    attributes:
      label: Command it touches
      options:
        - Existing command
        - New command
        - Install or distribution
        - Output or completion
        - Not sure
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: The problem or use case
      description: What you are trying to do, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: beneficiaries
    attributes:
      label: Who benefits
      description: Who else runs into this, and how often.
    validations:
      required: false
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: "A rough shape is fine; this does not need to be a full design."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and workarounds
      description: Other approaches you considered, and any workaround you use now.
    validations:
      required: false
  - type: dropdown
    id: contribute
    attributes:
      label: "Would you be willing to help implement this?"
      options:
        - "Yes"
        - Maybe
        - "No"
    validations:
      required: false
