# The crew's tool server: the Kubernetes MCP server in read-only mode, which
# registers only tools that do not change the cluster. It runs as the
# homelab-health-guide-kubernetes-mcp ServiceAccount, whose RBAC grants read access to this
# namespace. Agents reach it through the crew's MCPGateway, never directly, and
# each specialist enables only its own tools (agents.yaml).
apiVersion: kubemoot.ai/v1alpha1
kind: MCPServer
metadata:
  name: homelab-health-guide-kubernetes-mcp
  labels:
    kubemoot.ai/crew: homelab-health-guide
spec:
  # A pinned release of the Kubernetes MCP server; move to a newer tag when you upgrade.
  image: quay.io/containers/kubernetes_mcp_server:v0.0.63
  transport: stdio
  port: 8080
  replicas: 1
  serviceAccountName: homelab-health-guide-kubernetes-mcp
  securityMode: relaxed
  command: ["/app/kubernetes-mcp-server", "--read-only"]
  capabilities: [kubernetes, pods, resources, events]
  # How to call a tool belongs in the tool's own description, not in an agent's prompt.
  # These add what the server's descriptions leave out; the gateway serves them to the
  # agents with the tool list. The prompts keep behavior only.
  toolOverrides:
    - name: resources_list
      parameters:
        namespace:
          description: "Namespace to list from. Omit it to list every namespace this server can read."
    - name: resources_get
      parameters:
        namespace:
          description: "Namespace of the resource. Pass it for a namespaced kind; when omitted, the server uses its own namespace, not the one you mean."
    - name: pods_log
      parameters:
        tail:
          description: "Number of lines to read from the end of the log, 100 by default. Ask for only as many as the question needs, for example 20."
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
---
apiVersion: kubemoot.ai/v1alpha1
kind: MCPGateway
metadata:
  name: homelab-health-guide-gateway
  labels:
    kubemoot.ai/crew: homelab-health-guide
spec:
  implementation: kubemoot
  port: 8080
  replicas: 1
  mcpServerSelector:
    matchLabels:
      kubemoot.ai/crew: homelab-health-guide
  resources:
    requests:
      cpu: 100m
      memory: 768Mi
    limits:
      cpu: 500m
      memory: 1Gi
