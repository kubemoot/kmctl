apiVersion: kubemoot.ai/v1alpha1
kind: Agent
metadata:
  name: hello-reviewer
  labels:
    kubemoot.ai/crew: hello
    kubemoot.ai/role: analyst
spec:
  type: chat
  description: "Checks the answer against the data the other specialists gathered and flags unsupported claims."
  triageSummary: "Reviews the findings the other specialists gathered: checks that each claim is supported by tool output, reconciles contradictions, and draws the conclusion (healthy or not, and why)."
  discussRole: analyst
  capabilities: [reasoning]
  discussChannels: [kubernetes]
  discussKeywords: [healthy, unhealthy, why, check, review, summary, overall]
  promptRefs: [discussion-protocol, response-style, hello-reviewer-system]
  temperature: "0.2"
  maxTokens: 4096
  deployment:
    replicas: 1
    port: 8080
    env:
      # An analyst calls no tools: it reasons over what the toolers gathered.
      - name: KUBEMOOT_GATEWAY_ENABLED
        value: "false"
