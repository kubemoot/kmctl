# Values for the hello crew. The crew's manifests are under templates/; move a
# setting here when you want it to vary per install.

access:
  # false: the crew's Kubernetes MCP server can read only the release namespace
  # (a Role). true: it can read every namespace (a ClusterRole), still read-only
  # and still without Secrets. The prompts follow it: false keeps every agent on
  # the release namespace; true has the specialists read every namespace and name
  # the namespace of each resource they report.
  clusterWide: false

# The NATS JetStream server Kubemoot runs on. The reviewer's workspace server reads
# the results the toolers stored from it. This is where the Kubemoot quickstart
# installs NATS; change it when your cluster runs NATS elsewhere.
nats:
  url: "nats://nats.nats.svc.cluster.local:4222"
