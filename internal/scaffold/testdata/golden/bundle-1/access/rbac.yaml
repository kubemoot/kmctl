# Read access for the crew's Kubernetes MCP server: get, list, and watch on the
# namespace's resources and nothing else. Secrets are left out: Kubernetes cannot
# grant their names without their data, so the crew names Secrets from the
# references in pod specs instead.
# kmctl apply takes only kubemoot.ai kinds, so apply this file with kubectl:
#
#   kubectl apply -n crew-hello -f access/
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hello-kubernetes-mcp
  labels:
    kubemoot.ai/crew: hello
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hello-kubernetes-mcp
  labels:
    kubemoot.ai/crew: hello
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, services, endpoints, configmaps, serviceaccounts, events, persistentvolumeclaims]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, replicasets, statefulsets, daemonsets]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
  - apiGroups: [events.k8s.io]
    resources: [events]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses, networkpolicies]
    verbs: [get, list, watch]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [httproutes, gateways]
    verbs: [get, list, watch]
  - apiGroups: [kubemoot.ai]
    resources: [crews, agents, promptmodules, models, mcpservers, mcpgateways]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hello-kubernetes-mcp
  labels:
    kubemoot.ai/crew: hello
subjects:
  - kind: ServiceAccount
    name: hello-kubernetes-mcp
    namespace: crew-hello
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: hello-kubernetes-mcp
