version: 2

project_name: kmctl

before:
  hooks:
    - go mod tidy

builds:
  - id: kmctl
    main: .
    binary: kmctl
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/kubemoot/kmctl/internal/version.Version={{ .Version }}
      - -X github.com/kubemoot/kmctl/internal/version.Commit={{ .ShortCommit }}
      - -X github.com/kubemoot/kmctl/internal/version.Date={{ .Date }}

archives:
  - id: kmctl
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: checksums.txt

# Release notes list only what changes for kmctl's users, the same rule as the shared
# release action: breaking changes, features, fixes and performance. A commit that matches
# no group (ci, chore, docs, test, build, refactor, style) is left out, and so are fixes
# scoped to tests, CI, the build or dependency bumps.
changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - '^fix\((test|tests|ci|build|deps|deps-dev|release)\)'
  groups:
    - title: Breaking changes
      regexp: '^[a-z]+(\([^)]*\))?!:'
      order: 0
    - title: New
      regexp: '^feat(\([^)]*\))?:'
      order: 1
    - title: Fixed
      regexp: '^fix(\([^)]*\))?:'
      order: 2
    - title: Faster
      regexp: '^perf(\([^)]*\))?:'
      order: 3

release:
  github:
    owner: kubemoot
    name: kmctl
  # GoReleaser creates the GitHub Release as a draft, uploads every archive and the
  # checksums, then publishes it; draft: false only means it publishes at the end. That is
  # the order GitHub's immutable releases require (assets locked once published).
  # draft: true would leave the release unpublished.
  draft: false
  prerelease: auto
