version: 2

project_name: kmctl

before:
  hooks:
    - go mod tidy

builds:
  - id: kmctl
    main: .
    binary: kmctl
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/kubemoot/kmctl/internal/version.Version={{ .Version }}
      - -X github.com/kubemoot/kmctl/internal/version.Commit={{ .ShortCommit }}
      - -X github.com/kubemoot/kmctl/internal/version.Date={{ .Date }}

archives:
  - id: kmctl
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: checksums.txt

# Keyless Sigstore signature of the checksums file: cosign signs with the short-lived
# certificate Sigstore issues for the workflow's GitHub OIDC identity, so no signing key
# is stored anywhere. checksums.txt.sigstore.json holds the signature, the certificate,
# and the transparency log entry; a verified checksums file vouches for every archive.
signs:
  - id: cosign
    cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - --yes

# Release notes list only what changes for kmctl's users, the same rule as the shared
# release action: breaking changes, features, fixes and performance. A commit that matches
# no group (ci, chore, docs, test, build, refactor, style) is left out, and so are fixes
# scoped to tests, CI, the build or dependency bumps.
changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - '^fix\((test|tests|ci|build|deps|deps-dev|release)\)'
  groups:
    - title: Breaking changes
      regexp: '^[a-z]+(\([^)]*\))?!:'
      order: 0
    - title: New
      regexp: '^feat(\([^)]*\))?:'
      order: 1
    - title: Fixed
      regexp: '^fix(\([^)]*\))?:'
      order: 2
    - title: Faster
      regexp: '^perf(\([^)]*\))?:'
      order: 3

release:
  github:
    owner: kubemoot
    name: kmctl
  # GoReleaser leaves the GitHub Release a draft holding every archive, the checksums,
  # and their signature; Publish Release then attaches the build provenance and publishes
  # it. GitHub's immutable releases lock the assets once a release is published, so
  # every asset goes on the draft first.
  draft: true
  replace_existing_draft: true
  prerelease: auto
